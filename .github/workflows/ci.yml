name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.21, 1.22]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake portaudio19-dev

    - name: Build whisper dependencies
      run: |
        cd whisper.cpp
        mkdir -p build
        cd build
        cmake ..
        make -j$(nproc)

    - name: Run unit tests
      run: |
        go test -v -short ./src/pkg/...

    - name: Build application
      run: |
        make build

    - name: Test binary
      run: |
        ./focushelper --help

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake portaudio19-dev

    - name: Build whisper dependencies
      run: |
        cd whisper.cpp
        mkdir -p build
        cd build
        cmake ..
        make -j$(nproc)

    - name: Build application
      run: |
        make build

    - name: Create release archive
      run: |
        tar -czf focus-helper-linux-amd64.tar.gz focushelper
        zip -r focus-helper-linux-amd64.zip focushelper

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: focus-helper-linux-amd64
        path: |
          focus-helper-linux-amd64.tar.gz
          focus-helper-linux-amd64.zip
          focushelper

  docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: '0.121.2'
        extended: true

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Install dependencies
      run: |
        cd docs
        npm install

    - name: Build with Hugo
      run: |
        cd docs
        hugo --minify --baseURL ${{ steps.pages.outputs.base_url }}

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/public

  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: docs
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
