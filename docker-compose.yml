
services:
  focus-helper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focus-helper
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - FOCUSHELPER_DOCKER_MODE=true
    volumes:
      - focus-helper-data:/home/focushelper/.config/focushelper
    devices:
      - "/dev/snd:/dev/snd"
    privileged: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    group_add:
      - audio

volumes:
  focus-helper-data:
